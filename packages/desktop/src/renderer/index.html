<!doctype html>
<html lang="en" style="background-color: var(--background-base)">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>OpenCode</title>
    <link rel="icon" type="image/png" href="./favicon-96x96-v3.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon-v3.svg" />
    <link rel="shortcut icon" href="./favicon-v3.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon-v3.png" />
    <link rel="preload" href="./assets/Inter.ttf" as="font" type="font/ttf" crossorigin />
    <meta name="theme-color" content="#F8F7F7" />
    <meta property="og:image" content="./social-share.png" />
    <meta property="twitter:image" content="./social-share.png" />
    <script id="oc-theme-preload-script" src="./oc-theme-preload.js"></script>
    <style>
      #oc-startup-preloader {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: grid;
        place-items: center;
        gap: 18px;
        color: #252525;
        background: #fafafa;
        opacity: 1;
        visibility: visible;
        transition:
          opacity 180ms ease,
          visibility 180ms ease;
      }

      #oc-startup-preloader[aria-hidden="true"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #oc-startup-preloader svg {
        width: 40px;
        height: 50px;
      }

      #oc-startup-preloader span {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      #oc-startup-preloader::after {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        border: 2px solid color-mix(in srgb, currentColor 22%, transparent);
        border-top-color: currentColor;
        border-radius: 999px;
        animation: oc-startup-preloader-spin 700ms linear infinite;
      }

      html[data-color-scheme="dark"] #oc-startup-preloader {
        color: #e5e5e5;
        background: #080808;
      }

      @keyframes oc-startup-preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #oc-startup-preloader {
          transition: none;
        }

        #oc-startup-preloader::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body class="antialiased overscroll-none text-12-regular overflow-hidden">
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="oc-startup-preloader" role="status" aria-label="Loading OpenCode">
      <svg viewBox="0 0 80 100" fill="none" aria-hidden="true">
        <path d="M60 80H20V40H60V80Z" fill="currentColor" opacity="0.55" />
        <path d="M60 20H20V80H60V20ZM80 100H0V0H80V100Z" fill="currentColor" />
      </svg>
      <span>Loading OpenCode</span>
    </div>
    <div id="root" class="flex flex-col h-dvh"></div>
    <script src="./index.tsx" type="module"></script>
  </body>
</html>
